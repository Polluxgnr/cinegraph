[project]
name = "cinegraph"
version = "0.1.0"
description = "Personal film and TV-series recommender"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "typer>=0.12",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "implicit>=0.7.2",
  "fastembed>=0.4",
  "anthropic>=0.70",
  "rapidfuzz>=3.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
cinegraph = "cinegraph.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cinegraph*"]

[tool.setuptools.package-data]
cinegraph = ["*.sql", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (DATABASE_URL)"]
