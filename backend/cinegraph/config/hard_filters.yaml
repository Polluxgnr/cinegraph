# Hard filters from your taste. Applied to recommendations, swipe cards and "Tonight";
# never to your own watchlist or ratings. Edit freely.

romance:
  # dropped when Romance is the main genre, or when it's tagged romance without any of these
  # "strong" genres (a love story inside a thriller or a war film stays)
  strong_genres: [Thriller, Crime, War, Science Fiction, Horror, Mystery, Action, Western, Documentary,
                  Animation, History, Action & Adventure, Sci-Fi & Fantasy, War & Politics]
  keywords: [romantic comedy, romcom, love triangle, chick flick]

musicals:
  keywords: [musical, jukebox musical, broadway musical, stage musical, singing]

laugh_track_sitcoms:
