name: cinegraph

# Local data pipeline. The app itself is a static site (web/), deployed to GitHub Pages.
#   docker compose up -d db
#   docker compose run --rm pipeline cinegraph ingest movielens   (or run the CLI from backend/.venv)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cinegraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinegraph}
      POSTGRES_DB: ${POSTGRES_DB:-cinegraph}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinegraph} -d ${POSTGRES_DB:-cinegraph}"]
      interval: 3s
      timeout: 3s
      retries: 30

  pipeline:
    build: ./backend
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cinegraph}:${POSTGRES_PASSWORD:-cinegraph}@db:5432/${POSTGRES_DB:-cinegraph}
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./docs:/app/docs:ro
      - ./web/public/data:/app/export
    command: ["cinegraph", "--help"]
    depends_on:
      db:
        condition: service_healthy

  # Optional v1 server mode (FastAPI). The web app no longer needs it.
  api:
    build: ./backend
    profiles: ["server"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cinegraph}:${POSTGRES_PASSWORD:-cinegraph}@db:5432/${POSTGRES_DB:-cinegraph}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
