name: cinegraph

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-cinegraph}:${POSTGRES_PASSWORD:-cinegraph}@db:5432/${POSTGRES_DB:-cinegraph}
    DATA_DIR: /data
  volumes:
    - ./data:/data
    - ./docs:/app/docs:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cinegraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinegraph}
      POSTGRES_DB: ${POSTGRES_DB:-cinegraph}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinegraph} -d ${POSTGRES_DB:-cinegraph}"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    <<: *backend
    command: ["uvicorn", "cinegraph.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: ["python", "-m", "cinegraph.worker"]

  web:
    build:
      context: ./web
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
