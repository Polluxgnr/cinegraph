name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinegraph
          POSTGRES_PASSWORD: cinegraph
          POSTGRES_DB: cinegraph
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cinegraph" --health-interval 3s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://cinegraph:cinegraph@127.0.0.1:5433/cinegraph
      TEST_ADMIN_DATABASE_URL: postgresql://cinegraph:cinegraph@127.0.0.1:5433/cinegraph
      EMBEDDER: lsa
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run pytest -q

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
