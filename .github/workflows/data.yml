name: Build catalogue

# Weekly (and on demand): refresh the catalogue, retrain the offline models and publish the static
# data as a release asset. The Postgres state is carried between runs in the Actions cache, so each
# run is incremental (TMDB crawl and Wikidata enrichment only fetch what's missing).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      full_tmdb:
        description: "Crawl the whole TMDB catalogue (very long)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinegraph
          POSTGRES_PASSWORD: cinegraph
          POSTGRES_DB: cinegraph
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cinegraph" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://cinegraph:cinegraph@127.0.0.1:5433/cinegraph
      DATA_DIR: ${{ github.workspace }}/data
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}  # optional: video length, likes, comments
      WIKIDATA_CONTACT: https://github.com/${{ github.repository }}
      MOVIELENS_VARIANT: ml-32m          # 32M ratings from 200k people: the "who likes what" signal
      MOVIELENS_MIN_RATINGS: "800"      # well-known films become new catalogue entries
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e .
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # the database is carried between runs in the (private) Actions cache, never published
      - name: Restore previous database
        uses: actions/cache/restore@v4
        with:
          path: /tmp/db.dump
          key: cinegraph-db-${{ github.run_id }}
          restore-keys: cinegraph-db-
      - name: Load it (incremental build)
        run: |
          if [ -f /tmp/db.dump ]; then pg_restore --no-owner --clean --if-exists -d "$DATABASE_URL" /tmp/db.dump || true; fi
          uv run cinegraph init-db

      - name: MovieLens (collaborative-filtering signal)
        run: uv run cinegraph ingest movielens

      - name: TMDB (posters, credits, keywords, FR streaming)
        if: env.TMDB_API_KEY != ''
        run: uv run cinegraph ingest tmdb --top-movies 9000 --top-tv 4500 ${{ inputs.full_tmdb && '--full' || '' }}

      - name: Trailers (TMDB videos, new titles only)
        if: env.TMDB_API_KEY != ''
        run: uv run cinegraph ingest trailers

      - name: French titles and synopses (TMDB fr-FR, new titles only)
        if: env.TMDB_API_KEY != ''
        run: uv run cinegraph ingest french

      - name: Wikidata enrichment + links + Wikipedia images
        run: |
          uv run cinegraph ingest wikidata --tv-bootstrap 1200
          uv run cinegraph ingest links

      - name: Models (graph, embeddings, ALS)
        run: |
          uv run cinegraph build graph
          uv run cinegraph build embeddings
          uv run cinegraph build cf

      - name: Offline evaluation (hidden favourites, 4 methods)
        continue-on-error: true   # a measurement, never a reason to skip publishing the catalogue
        run: uv run cinegraph evaluate --users 2000

      - name: Static export (all domains)
        run: |
          # start from the previous export so a source that times out keeps last week's data
          mkdir -p ../site-data
          if gh release download data-latest --pattern data.tar.gz --dir /tmp 2>/dev/null; then tar -xzf /tmp/data.tar.gz -C ../site-data; fi
          uv run cinegraph export-static --out ../site-data

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The app's own engine on held-out users (before / after the last tuning)
        continue-on-error: true
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          CINEGRAPH_DATA=../site-data/films CINEGRAPH_EVAL_USERS=$DATA_DIR/eval_users.json CINEGRAPH_EVAL_OUT=/tmp/app-eval.json             npx vitest run --config vitest.replay.config.ts lib/engine/heldout.eval.ts
          python3 - <<'PY'
          import json, pathlib
          m = pathlib.Path("../site-data/manifest.json")
          man = json.loads(m.read_text())
          man.setdefault("eval", {})["app"] = json.loads(pathlib.Path("/tmp/app-eval.json").read_text())
          m.write_text(json.dumps(man))
          PY

      - name: Publish data release (static catalogue only)
        run: |
          tar -czf /tmp/data.tar.gz -C ../site-data .
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Catalogue data" \
            --notes "Static catalogue served by the site. Not source code." --latest=false
          gh release upload data-latest /tmp/data.tar.gz --clobber

      - name: Dump database for the next run
        run: pg_dump -Fc --no-owner -d "$DATABASE_URL" -f /tmp/db.dump
      - uses: actions/cache/save@v4
        with:
          path: /tmp/db.dump
          key: cinegraph-db-${{ github.run_id }}

      - name: Redeploy the site with the new data
        run: gh workflow run pages.yml --ref main
