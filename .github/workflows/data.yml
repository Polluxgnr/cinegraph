name: Build catalogue

# Weekly (and on demand): refresh the catalogue, retrain the offline models and publish the static
# data as a release asset. The Postgres state is carried between runs as a pg_dump asset, so each
# run is incremental (TMDB crawl and Wikidata enrichment only fetch what's missing).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      full_tmdb:
        description: "Crawl the whole TMDB catalogue (very long)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinegraph
          POSTGRES_PASSWORD: cinegraph
          POSTGRES_DB: cinegraph
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cinegraph" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://cinegraph:cinegraph@127.0.0.1:5433/cinegraph
      DATA_DIR: ${{ github.workspace }}/data
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      WIKIDATA_CONTACT: https://github.com/${{ github.repository }}
      MOVIELENS_VARIANT: ml-latest-small
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e .
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Restore previous database (incremental build)
        run: |
          if gh release download data-latest --pattern db.dump --dir /tmp 2>/dev/null; then
            pg_restore --no-owner --clean --if-exists -d "$DATABASE_URL" /tmp/db.dump || true
          fi
          uv run cinegraph init-db

      - name: MovieLens (collaborative-filtering signal)
        run: uv run cinegraph ingest movielens

      - name: TMDB (posters, credits, keywords, FR streaming)
        if: env.TMDB_API_KEY != ''
        run: uv run cinegraph ingest tmdb --top-movies 6000 --top-tv 3000 ${{ inputs.full_tmdb && '--full' || '' }}

      - name: Wikidata enrichment + links + Wikipedia images
        run: |
          uv run cinegraph ingest wikidata --tv-bootstrap 1200
          uv run cinegraph ingest links

      - name: Models (graph, embeddings, ALS)
        run: |
          uv run cinegraph build graph
          uv run cinegraph build embeddings
          uv run cinegraph build cf

      - name: Static export (all domains)
        run: |
          # start from the previous export so a source that times out keeps last week's data
          mkdir -p ../site-data
          if gh release download data-latest --pattern data.tar.gz --dir /tmp 2>/dev/null; then tar -xzf /tmp/data.tar.gz -C ../site-data; fi
          uv run cinegraph export-static --out ../site-data

      - name: Publish data release
        run: |
          tar -czf /tmp/data.tar.gz -C ../site-data .
          pg_dump -Fc --no-owner -d "$DATABASE_URL" -f /tmp/db.dump
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Catalogue data" \
            --notes "Generated by the Build catalogue workflow. Not source code." --latest=false
          gh release upload data-latest /tmp/data.tar.gz /tmp/db.dump --clobber

      - name: Redeploy the site with the new data
        run: gh workflow run pages.yml --ref main
