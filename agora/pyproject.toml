[project]
name = "agora"
version = "0.1.0"
description = "Research anything from what real people say, with the sources shown."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "trafilatura",
  "yt-dlp",
  "ddgs",
  "playwright",
  "anthropic",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
agora = "agora.__main__:main"

[tool.setuptools.packages.find]
include = ["agora*"]

[tool.setuptools.package-data]
agora = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["live: hits the real internet (run with -m live)"]
addopts = "-m 'not live'"
